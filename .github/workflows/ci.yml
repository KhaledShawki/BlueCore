name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Blue CLI
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Install formatter dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget curl unzip

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

          python -m pip install --upgrade pip
          python -m pip install black==25.1.0

          curl -L https://github.com/JohnnyMorganz/StyLua/releases/download/v2.1.0/stylua-linux-x86_64.zip -o stylua-linux-x86_64.zip
          unzip -q stylua-linux-x86_64.zip -d stylua-bin
          sudo install stylua-bin/stylua /usr/local/bin/stylua

          clang-format --version
          stylua --version
          black --version

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          chmod +x tools/premake/linux/premake5
          python scripts/blue.py format-check

  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.config }} ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            config: Debug
            variant: ninja-clang-static
            args: --backend=ninja --toolchain=clang --linkage=static

          - os: ubuntu-latest
            runner: ubuntu-latest
            config: Release
            variant: gmake-gcc-static
            args: --backend=gmake --toolchain=gcc --linkage=static

          - os: ubuntu-latest
            runner: ubuntu-latest
            config: Shipping
            variant: gmake-clang-shared
            args: --backend=gmake --toolchain=clang --linkage=shared

          - os: macos-latest
            runner: macos-latest
            config: Debug
            variant: ninja-clang-static
            args: --backend=ninja --toolchain=clang --linkage=static

          - os: macos-latest
            runner: macos-latest
            config: Release
            variant: gmake-clang-shared
            args: --backend=gmake --toolchain=clang --linkage=shared

          - os: macos-latest
            runner: macos-latest
            config: Shipping
            variant: ninja-clang-static
            args: --backend=ninja --toolchain=clang --linkage=static

          - os: windows-latest
            runner: windows-2025-vs2026
            config: Debug
            variant: vs2026-msvc-static
            args: --backend=vs2026 --toolchain=msvc --linkage=static

          - os: windows-latest
            runner: windows-2025-vs2026
            config: Release
            variant: vs2026-msvc-shared
            args: --backend=vs2026 --toolchain=msvc --linkage=shared

          - os: windows-latest
            runner: windows-2025-vs2026
            config: Shipping
            variant: vs2026-msvc-static
            args: --backend=vs2026 --toolchain=msvc --linkage=static

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ninja-build clang g++ make
          chmod +x tools/premake/linux/premake5

      - name: Setup macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          brew install ninja make
          chmod +x tools/premake/macos/premake5

      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Print MSBuild version
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          where msbuild
          msbuild -version

      - name: Run tests
        run: python scripts/blue.py test --config=${{ matrix.config }} ${{ matrix.args }}
